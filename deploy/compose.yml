# Vorlage für den Betrieb hinter dem vorhandenen Reverse Proxy.
# Der Validator hängt nur im internen Netz und hat damit keinen ausgehenden Zugriff.
# Der Dienst "ingress" ist ein Beispiel: Ihn durch den eigenen Proxy ersetzen oder diesen dem Netz einvoice-internal hinzufügen.
name: einvoice

services:
  validator:
    # Standard: veröffentlichtes Image. Für ein lokal geladenes Archiv: EV_IMAGE=einvoice-validator:1.0.0
    image: ${EV_IMAGE:-ghcr.io/tobiasredel/einvoice-validator:${EV_VERSION:-1.0.0}}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    ulimits:
      core: 0
    mem_limit: 6g
    init: true
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment:
      PARALLEL: "4"
    networks: [einvoice-internal]

  ingress:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${EV_PORT:-8080}:8080"
    depends_on: [validator]
    networks: [einvoice-internal, einvoice-edge]

networks:
  einvoice-internal:
    internal: true
  einvoice-edge: {}
