# Beispiel für den vorgelagerten Proxy. TLS und Anmeldung (SSO) gehören an diese Stelle oder davor.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;

  # Datenschutz: Inhalte nicht zwischenspeichern und nicht protokollieren.
  log_format minimal '$time_iso8601 $status $request_method $uri $request_time';
  access_log /dev/stdout minimal;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_cache off;

  server {
    listen 8080;
    client_max_body_size 26m;
    client_body_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 120s;
    location / {
      proxy_pass http://validator:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }
  }
}
