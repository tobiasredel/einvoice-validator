version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # The image is built and tested on Java 21 (LTS). Move to the next LTS deliberately, not through an automatic PR.
      - dependency-name: eclipse-temurin
        versions: [">=22"]
